<!DOCTYPE html>
<html lang="zh_CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/ZZ8-8ZZ/image/202408230929123.ico">
    <title>赞助支持</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: #fff;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 导航栏样式 */
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
        }

        .logo img {
            height: 40px;
            width: auto;
        }

        .logo-text {
            font-size: 1.5em;
            font-weight: bold;
        }

        .back-btn {
            color: #fff;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .back-btn:hover {
            background: #ffdd00;
            color: #000;
            transform: scale(1.05);
        }

        /* 赞助内容样式 */
        .sponsor-content {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .sponsor-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .sponsor-header h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            color: #ffdd00;
        }

        .sponsor-header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .sponsor-methods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .sponsor-method {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s;
        }

        .sponsor-method:hover {
            transform: translateY(-5px);
        }

        .sponsor-method img {
            width: 200px;
            height: 200px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .sponsor-method h3 {
            color: #ffdd00;
            margin-bottom: 10px;
        }

        .sponsor-method p {
            font-size: 0.95em;
            opacity: 0.8;
        }

        .sponsor-note {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
        }

        .sponsor-note p {
            font-size: 0.95em;
            opacity: 0.9;
        }

        /* 广告联系提示样式 */
        .ad-contact {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 30px;
            margin-top: 30px;
            border-left: 6px solid #ffdd00;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .ad-contact::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255, 221, 0, 0.1), transparent);
            z-index: 0;
        }

        .ad-contact-icon {
            font-size: 3em;
            color: #ffdd00;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .ad-contact-content {
            flex-grow: 1;
            position: relative;
            z-index: 1;
        }

        .ad-contact h3 {
            color: #ffdd00;
            margin-bottom: 12px;
            font-size: 1.5em;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .ad-contact p {
            font-size: 1em;
            opacity: 1;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .email-highlight {
            display: block;
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
            background: rgba(255, 221, 0, 0.2);
            padding: 8px 15px;
            border-radius: 5px;
            margin: 15px 0;
            text-align: center;
            border: 1px dashed rgba(255, 221, 0, 0.5);
        }

        .ad-contact-btn {
            display: inline-block;
            background: rgba(255, 221, 0, 0.8);
            color: #000;
            padding: 10px 25px;
            border-radius: 5px;
            text-decoration: none;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .ad-contact-btn:hover {
            background: #ffdd00;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 768px) {
            .sponsor-header h1 {
                font-size: 2em;
            }

            .sponsor-method img {
                width: 180px;
                height: 180px;
            }

            .ad-contact {
                flex-direction: column;
                text-align: center;
                padding: 20px;
            }

            .ad-contact-icon {
                margin-bottom: 10px;
                font-size: 2.5em;
            }

            .ad-contact h3 {
                font-size: 1.4em;
            }

            .email-highlight {
                font-size: 1.1em;
                padding: 10px;
                margin: 12px 0;
            }

            .ad-contact-btn {
                width: 100%;
                padding: 12px 0;
            }
        }
    </style>
</head>
